<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">SLP CONNECT™ Enterprise Operational Truth Layer</title>
  <desc id="d">A central horizontal truth layer, anchored by a verified shield, connects fragmented enterprise systems (ERP, WMS, TMS, LIMS) to Finance, Compliance, Customer Portal, API / EDI and Mobile Execution, capturing identity, custody, movement, status, exceptions, billing and evidence.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2C5F86"/>
      <stop offset="0.55" stop-color="#173E5E"/>
      <stop offset="1" stop-color="#0B1F33"/>
    </radialGradient>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2BB3D9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2BB3D9" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#38C6E8" stop-opacity="0.75"/>
      <stop offset="0.82" stop-color="#2BB3D9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2BB3D9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#F2C14E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2C14E" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEF3"/>
      <stop offset="1" stop-color="#9FB0C0"/>
    </linearGradient>
    <linearGradient id="shieldIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324D"/>
      <stop offset="1" stop-color="#0B1F33"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CC9E4"/>
    </marker>
    <style>
      .node rect { fill: #0B1F33; stroke: #6FA9CF; stroke-width: 2; }
      .node text { fill: #fff; font-weight: 700; text-anchor: middle; }
      .lbl { fill: #fff; font-size: 30px; font-weight: 600; text-anchor: middle; }
      .flow { fill: none; stroke: #9CC9E4; stroke-width: 2; stroke-opacity: 0.75; }
      .flow-thin { fill: none; stroke: #6FA9CF; stroke-width: 1.2; stroke-opacity: 0.45; }
      .ico { fill: none; stroke: #D8E4EE; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .ico-cap { fill: #C9D8E5; font-size: 22px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 256H1536M0 512H1536M0 768H1536M384 0V1024M768 0V1024M1152 0V1024"/>
  </g>

  <!-- Title -->
  <text x="768" y="104" text-anchor="middle" font-size="68" font-weight="800" letter-spacing="4" fill="#EAF2F8">SLP CONNECT<tspan font-size="30" dy="-30">™</tspan></text>
  <text x="768" y="150" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="6" fill="#9CC9E4">ENTERPRISE OPERATIONAL TRUTH LAYER</text>
  <line x1="468" y1="176" x2="1068" y2="176" stroke="#9CC9E4" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Vertical data rays -->
  <g stroke="#9CC9E4" stroke-opacity="0.22" stroke-width="2">
    <path d="M708 200V700M728 220V680M748 190V720M768 180V740M788 190V720M808 220V680M828 200V700"/>
  </g>

  <!-- Flow lines: left systems into the layer -->
  <g class="flow-thin">
    <path d="M410 232 C 560 250, 600 360, 700 430"/>
    <path d="M320 330 C 500 340, 580 400, 690 445"/>
    <path d="M230 430 C 420 430, 560 440, 680 460"/>
    <path d="M230 520 C 420 510, 560 490, 680 475"/>
    <path d="M200 600 C 420 640, 580 560, 700 495"/>
    <path d="M1126 232 C 976 250, 936 360, 836 430"/>
    <path d="M1216 330 C 1036 340, 956 400, 846 445"/>
    <path d="M1290 440 C 1110 440, 976 445, 856 460"/>
    <path d="M1230 550 C 1080 530, 960 495, 856 478"/>
    <path d="M1150 660 C 1010 620, 940 540, 836 495"/>
  </g>
  <g class="flow">
    <path d="M600 330 C 520 290, 470 250, 410 240" marker-end="url(#arrow)"/>
    <path d="M590 395 C 480 360, 400 340, 320 338" marker-end="url(#arrow)"/>
    <path d="M560 440 C 420 438, 300 438, 236 438" marker-end="url(#arrow)"/>
    <path d="M560 500 C 420 515, 300 518, 236 518" marker-end="url(#arrow)"/>
    <path d="M936 330 C 1016 290, 1060 245, 1106 230" marker-end="url(#arrow)"/>
    <path d="M946 395 C 1050 360, 1110 335, 1146 330" marker-end="url(#arrow)"/>
    <path d="M976 440 C 1110 440, 1220 442, 1266 442" marker-end="url(#arrow)"/>
    <path d="M976 500 C 1080 520, 1160 545, 1206 550" marker-end="url(#arrow)"/>
    <path d="M936 545 C 1010 600, 1060 640, 1116 652" marker-end="url(#arrow)"/>
  </g>

  <!-- Truth layer band -->
  <rect x="180" y="400" width="1176" height="120" fill="url(#band)" filter="url(#soft)" opacity="0.6"/>
  <rect x="220" y="410" width="1096" height="100" rx="8" fill="url(#band)"/>
  <g stroke="#E6F7FC" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M260 424H1276M240 444H1296M240 476H1296M260 496H1276"/>
  </g>
  <rect x="560" y="448" width="416" height="24" fill="url(#glow)" filter="url(#soft)"/>
  <text x="430" y="473" class="lbl">Enterprise</text>
  <text x="1096" y="473" class="lbl">Truth Layer</text>

  <!-- Shield -->
  <g transform="translate(768 460)">
    <path d="M0 -130 L105 -92 L105 10 C105 80 55 118 0 140 C-55 118 -105 80 -105 10 L-105 -92 Z" fill="url(#shield)" stroke="#0B1F33" stroke-width="4"/>
    <path d="M0 -112 L88 -80 L88 8 C88 66 46 98 0 118 C-46 98 -88 66 -88 8 L-88 -80 Z" fill="url(#shieldIn)"/>
    <!-- record stack -->
    <g fill="none" stroke="#C9D8E5" stroke-width="5" stroke-linecap="round">
      <rect x="-58" y="-62" width="82" height="96" rx="6"/>
      <path d="M-58 -30H24M-58 2H24"/>
    </g>
    <circle cx="28" cy="34" r="40" fill="#EAF2F8" stroke="#0B1F33" stroke-width="5"/>
    <path d="M8 34 L22 50 L50 18" fill="none" stroke="#0B1F33" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left: fragmented enterprise systems -->
  <g class="node" font-size="34">
    <g transform="translate(252 198)"><rect width="150" height="64" rx="8"/><text x="75" y="44">ERP</text></g>
    <g transform="translate(156 296)"><rect width="156" height="64" rx="8"/><text x="78" y="44">WMS</text></g>
    <g transform="translate(76 396)"><rect width="150" height="64" rx="8"/><text x="75" y="44">TMS</text></g>
    <g transform="translate(76 486)"><rect width="150" height="64" rx="8"/><text x="75" y="44">LIMS</text></g>
  </g>
  <g fill="#9CC9E4" font-size="15" text-anchor="middle" font-weight="600">
    <text x="327" y="282">Financial records</text>
    <text x="234" y="380">Warehouse</text>
    <text x="151" y="480">Transportation</text>
    <text x="151" y="570">Lab &amp; QC data</text>
  </g>

  <!-- Right: downstream consumers of operational truth -->
  <g class="node" font-size="30">
    <g transform="translate(1114 198)"><rect width="190" height="64" rx="8"/><text x="95" y="43">Finance</text></g>
    <g transform="translate(1152 296)"><rect width="222" height="64" rx="8"/><text x="111" y="43">Compliance</text></g>
    <g transform="translate(1272 396)"><rect width="196" height="94" rx="8"/><text x="98" y="38">Customer</text><text x="98" y="74">Portal</text></g>
    <g transform="translate(1214 520)"><rect width="222" height="64" rx="8"/><text x="111" y="43">API / EDI</text></g>
    <g transform="translate(1126 618)"><rect width="196" height="94" rx="8"/><text x="98" y="38">Mobile</text><text x="98" y="74">Execution</text></g>
  </g>

  <!-- Bottom: captured evidence dimensions -->
  <line x1="190" y1="792" x2="1346" y2="792" stroke="#9CC9E4" stroke-opacity="0.25" stroke-width="2"/>
  <g transform="translate(0 0)">
    <!-- Identity -->
    <g transform="translate(330 790)">
      <circle cx="0" cy="-30" r="20" class="ico"/>
      <path d="M-36 20 C-36 -6 36 -6 36 20 Z" class="ico"/>
      <text y="62" class="ico-cap">Identity</text>
    </g>
    <!-- Custody -->
    <g transform="translate(476 790)">
      <path d="M-18 -16 V-30 C-18 -52 18 -52 18 -30 V-16" class="ico"/>
      <rect x="-32" y="-16" width="64" height="42" rx="6" class="ico"/>
      <circle cx="0" cy="2" r="5" fill="#D8E4EE"/>
      <path d="M0 6 V14" class="ico"/>
      <text y="62" class="ico-cap">Custody</text>
    </g>
    <!-- Movement -->
    <g transform="translate(622 790)">
      <rect x="-38" y="-30" width="44" height="38" rx="3" class="ico" stroke="#38C6E8"/>
      <path d="M6 -16 H24 L38 0 V8 H6 Z" class="ico" stroke="#38C6E8"/>
      <circle cx="-22" cy="14" r="7" class="ico" stroke="#38C6E8"/>
      <circle cx="24" cy="14" r="7" class="ico" stroke="#38C6E8"/>
      <text y="62" class="ico-cap">Movement</text>
    </g>
    <!-- Status -->
    <g transform="translate(768 790)">
      <path d="M-24 22 V-40" class="ico"/>
      <path d="M-24 -40 H30 L20 -24 L30 -8 H-24" class="ico" fill="#1E5B8C"/>
      <text y="62" class="ico-cap">Status</text>
    </g>
    <!-- Exceptions -->
    <g transform="translate(914 790)">
      <path d="M0 -44 L40 22 H-40 Z" fill="#0B1F33" stroke="#F2C14E" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 -20 V2" stroke="#F2C14E" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="12" r="3.5" fill="#F2C14E"/>
      <text y="62" class="ico-cap">Exceptions</text>
    </g>
    <!-- Billing -->
    <g transform="translate(1060 790)">
      <path d="M-28 -44 H16 L28 -32 V22 H-28 Z" class="ico"/>
      <text x="0" y="8" text-anchor="middle" font-size="40" font-weight="800" fill="#D8E4EE">$</text>
      <text y="62" class="ico-cap">Billing</text>
    </g>
    <!-- Evidence -->
    <g transform="translate(1206 790)">
      <circle cx="-6" cy="-14" r="26" class="ico"/>
      <path d="M-18 -14 L-8 -4 L8 -24" class="ico" stroke="#38C6E8"/>
      <path d="M13 6 L34 26" class="ico"/>
      <text y="62" class="ico-cap">Evidence</text>
    </g>
  </g>

  <text x="768" y="960" text-anchor="middle" font-size="20" fill="#9CC9E4" letter-spacing="1.5">Know what happened · Prove what happened · Control what comes next</text>
  <text x="768" y="994" text-anchor="middle" font-size="14" fill="#6FA9CF" letter-spacing="1">Strategic Lab Partners · ERP-Complementary Platform</text>
</svg>
