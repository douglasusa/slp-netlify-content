      - name: Inject GA4 into HTML files
        run: |
          for file in $(find static -name "*.html"); do
            if ! grep -q "G-1K7MJPR4PP" "$file"; then
              echo "Injecting GA4 into $file"

              # Split file at <head> and insert snippet safely
              awk -v snippet="${{ steps.ga4.outputs.snippet }}" '
                BEGIN { inserted=0 }
                /<head>/ && !inserted {
                  print;
                  print snippet;
                  inserted=1;
                  next
                }
                { print }
              ' "$file" > "$file.tmp"

              mv "$file.tmp" "$file"
            else
              echo "GA4 already present in $file"
            fi
          done
