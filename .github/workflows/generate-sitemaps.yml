      - name: Generate FAQs Sitemap
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > static/sitemap-faqs.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> static/sitemap-faqs.xml
          find static/faqs -maxdepth 1 -name "*.html" | grep -v '/index.html$' | sort | while read file; do
            slug=$(basename "$file" .html)
            url="https://content.strategiclabpartners.com/faqs/$slug"
            echo "  <url><loc>$url</loc></url>" >> static/sitemap-faqs.xml
          done
          find static/faqs -mindepth 2 -name "index.html" | sort | while read file; do
            slug=$(basename "$(dirname "$file")")
            url="https://content.strategiclabpartners.com/faqs/$slug/"
            echo "  <url><loc>$url</loc></url>" >> static/sitemap-faqs.xml
          done
          echo '</urlset>' >> static/sitemap-faqs.xml
