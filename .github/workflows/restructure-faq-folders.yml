name: Restructure FAQ Flat Files to Folders
on:
  workflow_dispatch:

jobs:
  restructure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run restructure script
        run: python scripts/restructure_faqs.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: restructure 9 FAQ flat files to folder/index.html [automated]"
          git push
