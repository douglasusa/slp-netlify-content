name: Patch Canonical Tags on Folder FAQs
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch links and canonicals
        run: |
          python3 - <<'EOF'
          import os

          SLUGS = [
              "how-medical-fulfillment-supports-distributed-healthcare-networks",
              "why-standardized-logistics-are-essential-for-medical-programs",
              "how-medical-fulfillment-improves-accuracy-and-reliability",
              "how-medical-kitting-supports-multi-site-healthcare-organizations",
              "why-standardized-kits-are-important-for-healthcare-providers",
              "what-is-slp-connect",
              "how-does-slp-connect-support-program-visibility",
              "decentralized-at-home-collections",
              "sample-integrity-genomics-transcriptomics-proteomics-metabolomics",
          ]

          BASE = "static/faqs"
          BASE_URL = "https://content.strategiclabpartners.com"

          # 1. Fix relative .html links in faqs/index.html → trailing-slash
          index_path = os.path.join(BASE, "index.html")
          with open(index_path, "r", encoding="utf-8") as f:
              content = f.read()
          for slug in SLUGS:
              old = f'href="{slug}.html"'
              new = f'href="{slug}/"'
              if old in content:
                  content = content.replace(old, new)
                  print(f"FIXED faqs/index.html: {slug}.html → {slug}/")
          with open(index_path, "w", encoding="utf-8") as f:
              f.write(content)

          # 2. Fix /faqs/what-is-slp-connect (no slash) in static/index.html
          home_path = "static/index.html"
          with open(home_path, "r", encoding="utf-8") as f:
              content = f.read()
          for slug in SLUGS:
              old = f'href="/faqs/{slug}"'
              new = f'href="/faqs/{slug}/"'
              if old in content:
                  content = content.replace(old, new)
                  print(f"FIXED static/index.html: /faqs/{slug} → /faqs/{slug}/")
          with open(home_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Done.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: update relative .html links to trailing-slash in faqs/index.html and homepage [automated]"
          git pull --rebase && git push

