name: Patch Canonical Tags on Folder FAQs
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python scripts/patch_canonicals.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: patch canonical tags to trailing-slash on 9 folder FAQs [automated]"
          git push
