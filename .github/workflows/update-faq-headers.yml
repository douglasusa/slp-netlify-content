name: Fix FAQ Footers - White Background Black Text
on:
  workflow_dispatch:
jobs:
  update-faq-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fix footers in all FAQ HTML files
        run: |
          python3 << 'PYEOF'
          import os, re
          NEW_FOOTER = """<footer style="background:#ffffff;color:#000000;padding:40px 20px;border-top:1px solid #e0e0e0;"><div style="max-width:900px;margin:0 auto;text-align:center;"><h3 style="color:#000000;font-size:1.1rem;font-weight:700;letter-spacing:0.05em;margin-bottom:16px;">MISSION | Strategic Lab Partners (SLP)</h3><p style="color:#000000;font-size:0.95rem;line-height:1.7;margin-bottom:24px;">Strategic Lab Partners (SLP) transforms research infrastructures across Genomics, Multi-Omics, and Precision Medicine by unifying data precision, logistical speed, and sample integrity in one connected ecosystem. Through SLP CONNECT&trade;, our Premium Kitting Deployment and Centralized Management Platform, we integrate precision kit production, global logistics, and real-time digital visibility to ensure complete control from design to deployment. Our mission is to deliver reliable, scalable, and compliant operations that help research sponsors and CROs run complex studies with advanced-manufacturing accuracy. We elevate healthcare supply chains with universal kitting, serialized tracking, and value-based logistics&mdash;strengthening quality, reducing variability, and accelerating scientific discovery.</p><p style="color:#000000;font-size:0.85rem;">&copy; 2026 Strategic Lab Partners. All rights reserved.</p></div></footer>"""
          footer_pat = re.compile(r'<footer[^>]*>.*?</footer>', re.DOTALL)
          faq_dir = 'static/faqs'
          updated = 0
          for root, dirs, files in os.walk(faq_dir):
            for fname in files:
              if fname.endswith('.html'):
                fpath = os.path.join(root, fname)
                with open(fpath, 'r', encoding='utf-8') as f:
                  content = f.read()
                if '<footer' in content:
                  new_content = footer_pat.sub(NEW_FOOTER, content)
                  if new_content != content:
                    with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                    updated += 1
          print(f'Updated {updated} files')
          PYEOF
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Fix FAQ footers: white background, black text, mission statement"
          git push
