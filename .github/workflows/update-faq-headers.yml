name: Add Canonical Tags to All FAQ Pages

on:
  workflow_dispatch:

jobs:
  add-canonical-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add canonical tags to all FAQ HTML files
        run: |
          python3 << 'PYEOF'
          import os
          import re

          BASE_URL = "https://content.strategiclabpartners.com/faqs"
          FAQ_DIR = "static/faqs"

          canonical_pat = re.compile(r'<link[^>]+rel=["\']canonical["\'][^>]*>', re.IGNORECASE)
          head_close_pat = re.compile(r'</head>', re.IGNORECASE)

          updated = 0
          skipped = 0

          for root, dirs, files in os.walk(FAQ_DIR):
              # Skip index.html files
              for fname in sorted(files):
                  if not fname.endswith('.html'):
                      continue
                  if fname == 'index.html':
                      continue

                  fpath = os.path.join(root, fname)
                  slug = os.path.splitext(fname)[0]

                  # Build clean canonical URL
                  rel = os.path.relpath(root, FAQ_DIR)
                  if rel == '.':
                      canonical_url = f"{BASE_URL}/{slug}"
                  else:
                      canonical_url = f"{BASE_URL}/{rel}/{slug}"

                  canonical_tag = f'<link rel="canonical" href="{canonical_url}">'

                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()

                  # Remove any existing canonical tag
                  content = canonical_pat.sub('', content)

                  # Insert canonical tag before </head>
                  if head_close_pat.search(content):
                      content = head_close_pat.sub(f'  {canonical_tag}\n</head>', content, count=1)
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f"Updated: {fpath} -> {canonical_url}")
                      updated += 1
                  else:
                      print(f"SKIPPED (no </head>): {fpath}")
                      skipped += 1

          print(f"\nDone: {updated} files updated, {skipped} skipped.")
          PYEOF

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add static/faqs/
          git diff --cached --quiet || git commit -m "Add canonical tags to all FAQ pages for sitemap eligibility"
          git push
