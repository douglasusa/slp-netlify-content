name: Add Logo and Full Footer to FAQ Pages
on:
  workflow_dispatch:
jobs:
  update-faq-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update headers and footers in all FAQ HTML files
        run: |
          python3 << 'PYEOF'
          import os, re

          NEW_HEADER = '<header class="site-header"><div class="container"><a href="https://content.strategiclabpartners.com/faqs/" class="logo"><img src="https://content.strategiclabpartners.com/assets/logos/slp-white-full-logo.png" alt="Strategic Lab Partners" width="180"></a><nav class="main-nav"><a href="https://strategiclabpartners.com/slp-experience">About</a><a href="https://strategiclabpartners.com/3pl-management">Services</a><a href="https://content.strategiclabpartners.com/faqs/">FAQs</a><a href="https://strategiclabpartners.com/contact-slp">Contact</a></nav></div></header>'

          NEW_FOOTER = '<footer class="site-footer"><div class="container"><div class="footer-grid"><div class="footer-col footer-brand"><a href="https://strategiclabpartners.com" class="footer-logo"><img src="https://content.strategiclabpartners.com/assets/logos/slp-white-full-logo.png" alt="Strategic Lab Partners" width="160"></a><p>Precision kitting and 3PL management solutions for the life sciences industry.</p><p><strong>Phone:</strong> (800) 985-3422</p><p><strong>Email:</strong> orders@strategiclabpartners.com</p><p><strong>Hours:</strong> Mon-Fri | 8:00 am - 5:00 pm CST</p></div><div class="footer-col"><h4>Services</h4><ul><li><a href="https://strategiclabpartners.com/universal-kitting">Universal Kitting</a></li><li><a href="https://strategiclabpartners.com/3pl-management">3PL Management</a></li><li><a href="https://strategiclabpartners.com/bulk-supplies">Bulk Supplies</a></li><li><a href="https://strategiclabpartners.com/slp-experience">SLP Experience</a></li><li><a href="https://strategiclabpartners.com/contact-slp">Contact SLP</a></li></ul></div><div class="footer-col"><h4>Industries</h4><ul><li><a href="https://strategiclabpartners.com/clinical-trials">Clinical Trials</a></li><li><a href="https://strategiclabpartners.com/precision-medicine">Precision Medicine</a></li><li><a href="https://strategiclabpartners.com/dtc-genomics">DTC Genomics</a></li><li><a href="https://strategiclabpartners.com/diagnostics-lab-services">Diagnostics &amp; Lab Services</a></li><li><a href="https://strategiclabpartners.com/biobanking">BioBanking</a></li><li><a href="https://strategiclabpartners.com/life-sciences-logistics">Life Sciences Logistics</a></li></ul></div><div class="footer-col"><h4>Content Hub</h4><ul><li><a href="https://content.strategiclabpartners.com/resources">Resources</a></li><li><a href="https://content.strategiclabpartners.com/blogs">Blogs</a></li><li><a href="https://content.strategiclabpartners.com/faqs/">FAQs</a></li><li><a href="https://content.strategiclabpartners.com/case-studies">Case Studies</a></li></ul></div></div><div class="footer-bottom"><p>&copy; 2026 Strategic Lab Partners LLC. All rights reserved.</p></div></div></footer>'

          header_pattern = re.compile(r'<header class="site-header">.*?</header>', re.DOTALL)
          footer_pattern = re.compile(r'<footer class="site-footer">.*?</footer>', re.DOTALL)

          root = 'static/faqs'
          updated = 0
          for dirpath, dirnames, filenames in os.walk(root):
              for fname in filenames:
                  if fname.endswith('.html'):
                      fpath = os.path.join(dirpath, fname)
                      with open(fpath, 'r', encoding='utf-8') as f:
                          content = f.read()
                      new_content = header_pattern.sub(NEW_HEADER, content)
                      new_content = footer_pattern.sub(NEW_FOOTER, new_content)
                      if new_content != content:
                          with open(fpath, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          updated += 1
          print(f'Updated {updated} files')
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Use white logo in header and footer across all FAQ pages"
          git push
